<script>
(function(){
const TYPES={0:['Drum','--drum'],1:['Keygroup','--kg'],2:['Clip','--other'],3:['Plugin','--plugin'],4:['MIDI','--midi'],5:['CV','--other'],6:['Audio','--audio'],7:['Return','--other'],8:['Submix','--other'],9:['Output','--other']};
const PALETTE=[0xE53935,0xF4511E,0xFB8C00,0xFDD835,0xC0CA33,0x43A047,0x00897B,0x00ACC1,0x1E88E5,0x3949AB,0x8E24AA,0xD81B60,0x6D4C41,0x757575,0xFFFFFF];
const PPQ=960, NN=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const noteName=n=>NN[n%12]+(Math.floor(n/12)-2);
const $=id=>document.getElementById(id);
let S=null, RAW=null;            // S: what's shown; RAW: {head,text,arr} of the opened file (null for the example)
let selTracks=new Set(), tanchor=null, dragKind=null;
let selRows=new Set(), anchor=null, selClip=null, clipboard=[], undoStack=[], redoStack=[], savedNote='';
let downloads=null;
try{ window.claude&&window.claude.use&&window.claude.use('downloads').then(d=>{downloads=d; updateBar();}); }catch(e){}

/* ---------- reading an MPC 3 .xpj (text header + gzip JSON) ---------- */
async function readXpj(file){
  const head=new Uint8Array(await file.slice(0,2).arrayBuffer());
  if(!(head[0]===0x1f&&head[1]===0x8b)) throw new Error('This file isn’t an MPC 3 project. MPC 3 .xpj files are compressed; MPC 2 projects use a different format.');
  if(typeof DecompressionStream==='undefined') throw new Error('This browser can’t unpack the project. Use a current Safari, Chrome or Firefox.');
  const buf=new Uint8Array(await new Response(file.stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
  const cut=buf.indexOf(0x7b); if(cut<0) throw new Error('No project data found inside the file.');
  const headText=new TextDecoder().decode(buf.subarray(0,cut));
  const text=new TextDecoder().decode(buf.subarray(cut));
  const arr=findRowArray(text);
  const s=summarise(JSON.parse(text).data, file.name, headText.split('\n')[1]||'');
  if(arr.items.length!==s.rows.length) throw new Error('The rows in this project could not be matched up safely, so editing is turned off.');
  let tarr=null; try{ tarr=findTrackArray(text); if(tarr.items.length!==s.tracks.length||tarr.open>arr.open) tarr=null; }catch(e){ tarr=null; }
  return {s, raw:{head:headText,text,arr,tarr,size:file.size}};
}
function summarise(P,fname,version){
  const tracks=P.tracks.map(t=>{
    const pg=t.program||{}, o=t.midiOutputRoute||{}, dev=(o.outputPort||{}).deviceName||'<none>';
    const tr={name:t.name,type:pg.type,out:dev==='<none>'?null:{dev,ch:(o.outputChannel||0)+1}};
    if(pg.drum) tr.pads=pg.drum.instruments.filter(i=>(i.layersv||[]).some(l=>l.sampleName)).length;
    if(pg.plugin&&pg.plugin.plugin){const pp=pg.plugin.plugin; tr.plugin={name:(pp.description||{}).name,preset:pp.presetName};}
    return tr;});
  const rows=P.sharedClipMatrixData.map(r=>{
    const clips={};
    for(const c of r.clips){
      const v=c.value, ev=v.eventList.events, notes=[], pc=[], cc={}; let at=0, audio=null;
      for(const e of ev){
        if(e.type===3) notes.push([e.time,e.note.note,Math.round(e.note.velocity*127),e.note.length]);
        else if(e.type===1){const a=e.automation,p=a.parameter,val=Math.round(a.value*127);
          if(p===130) pc.push([e.time,val]); else if(p===131) at++; else if(p<128) cc[p]=(cc[p]||0)+1;}
        else if(e.type===4&&e.audio) audio=((e.audio.sample)||{}).name||e.audio.name;
      }
      clips[c.key]={n:v.name,colour:v.colour||0,len:v.endPulses,loop:v.loop,notes,pc,cc,at,audio};
    }
    return {name:r.name,colour:r.optionalColour||0,clips};});
  return {file:fname,version,bpm:P.masterTempo,tempoOn:P.masterTempoEnabled,tracks,rows};
}
function prepare(s){ // remember where each row and track came from and what it was called
  s.tracks.forEach((t,i)=>{ t._src=i; });
  s.rows.forEach((r,i)=>{ r._src=i; r._name=r.name; r._colour=r.colour;
    for(const c of Object.values(r.clips)){ c._name=c.n; c._colour=c.colour||0; } });
  return s;
}

/* ---------- musical key ---------- */
// Best guess from the notes: pitch classes weighted by length and velocity, compared with the Krumhansl-Kessler major and minor profiles.
const KMAJ=[6.35,2.23,3.48,2.33,4.38,4.09,2.52,5.19,2.39,3.66,2.29,2.88], KMIN=[6.33,2.68,3.52,5.38,2.60,3.53,2.54,4.75,3.98,2.69,3.34,3.17];

  const r=[]; for(let t=0;t<12;t++){ r.push([kcorr(h,KMAJ,t),t,false]); r.push([kcorr(h,KMIN,t),t,true]); }

  const tt=new Map(S.tracks.map(t=>[t.name,t]));
  const lists=Object.entries(r.clips).filter(([tn,c])=>{const t=tt.get(tn); return t&&PITCHED.has(t.type)&&c.notes&&c.notes.length;}).map(([,c])=>c.notes);
  const k=detectKey(lists); keyCache.set(r,{vals:sig,k}); return k; }
function keyRelation(a,b){ if(!a||!b) return ''; if(a.cam===b.cam) return 'same';
  return keyDist(a,b)===1?'near':''; }
function keyLabel(k){ return k?`${k.name} · ${k.cam}${k.conf==='clear'?'':k.conf==='likely'?' · likely':` · unsure, maybe ${k.alt.name}`}`:''; }

function keyDist(a,b){ const d=Math.abs(a.num-b.num), w=Math.min(d,12-d); return w+(a.minor!==b.minor?1:0); }
let keyFilter=null; // Camelot code to show, or null
let mixRow=null;    // when set, only rows that mix well with this row are shown

/* ---------- tidy row names ---------- */
const UNNAMED=/^\s*(?:(?:sequence|scene|row)\s*)?\d*\s*$/i;
// rows called just "2", "3" (or empty) are named after the named row above them: "My retreat - 2"
function plannedNames(scope){ const out=new Map(); let base=null, k=1;
  for(const r of S.rows){ if(!UNNAMED.test(r.name)){ base=r.name.replace(/ - \d+$/,''); k=/ - (\d+)$/.test(r.name)?+r.name.match(/ - (\d+)$/)[1]:1; continue; }
    k++; if(base&&(!scope||scope.has(r))) out.set(r,`${base} - ${k}`); }
  return out; }
function tidyPanel(scope){ const plan=plannedNames(scope); if(!plan.size) return '';
  const ex=[...plan.entries()].slice(0,3).map(([r,n])=>`“${esc(r.name)}” → “${esc(n)}”`).join(', ');
  return `<div class="sec">Tidy row names</div><button class="btn" id="tidy">Name ${plan.size} numbered row${plan.size>1?'s':''} after ${plan.size>1?'their song':'its song'}</button>
  <p class="hint">Rows called just a number take the name of the named row above them, for example ${ex}. ${scope?'Only the selected rows change.':'Select some rows first to rename only those.'} Undo puts the old names back.</p>`; }
function wireTidy(box,scope){ const b=box.querySelector('#tidy'); if(b) b.onclick=()=>{ const plan=plannedNames(scope);
  change(()=>{ for(const [r,n] of plan) r.name=n; },`Renamed ${plan.size} row${plan.size>1?'s':''}`); }; }

/* ---------- clip variations ---------- */
const SCALES={major:[0,2,4,5,7,9,11],minor:[0,2,3,5,7,8,10]};
function rng(seed){ let s=seed>>>0||1; return ()=>{ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; }; }
function scaleOf(k){ return k?{tonic:k.tonic,steps:SCALES[k.minor?'minor':'major']}:null; }
function toDeg(sc,p){ // nearest note of the scale, as a degree count from C-1
  let best=null; for(let d=-1;d<=1;d++){ const o=Math.floor((p-sc.tonic)/12)+d;
    sc.steps.forEach((s,i)=>{ const q=sc.tonic+o*12+s, dist=Math.abs(q-p); if(!best||dist<best[0]) best=[dist,o*7+i]; }); }
  return best[1]; }
function fromDeg(sc,d){ const o=Math.floor(d/7), i=((d%7)+7)%7; return sc.tonic+o*12+sc.steps[i]; }
function groups(ns){ const g=new Map(); for(const n of ns){ if(!g.has(n[0])) g.set(n[0],[]); g.get(n[0]).push(n); } return [...g.entries()].sort((a,b)=>a[0]-b[0]); }
const VAR_DEFAULT={len:'same',fill:'answer',pitch:'new',rhythm:'keep',vel:'natural',seed:1};
function makeVariation(c,t,key,o){

  const rhythm=pat=>{ let q=pat.map(n=>n.slice()), len=L;
    if(o.rhythm==='double'){ q=q.map(n=>[n[0]/2,n[1],n[2],n[3]/2]); q=q.concat(q.map(n=>[n[0]+L/2,n[1],n[2],n[3]])); }
    else if(o.rhythm==='half'){ q=q.map(n=>[n[0]*2,n[1],n[2],n[3]*2]); len=L*2; }
    else if(o.rhythm==='nudge'){ q=q.map(n=>[(n[0]+PPQ/4)%L,n[1],n[2],n[3]]); }
    else if(o.rhythm==='swing'){ q=q.map(n=>[n[0]%(PPQ/2)===PPQ/4?n[0]+Math.round(PPQ/12):n[0],n[1],n[2],n[3]]); }
    else if(o.rhythm==='sparse'){ const gs=groups(q); const keep=new Set(gs.filter(([tm],i)=>i===0||tm%PPQ===0||R()<0.4).map(g=>g[0])); q=q.filter(n=>keep.has(n[0])); }
    else if(o.rhythm==='busy'){ const gs=groups(q), add=[];
      for(let i=0;i<gs.length;i++){ const [t0,a]=gs[i], t1=i+1<gs.length?gs[i+1][0]:L+gs[0][0], gap=t1-t0;
        if(gap>=PPQ/2&&R()<0.75){ const top=a.reduce((m,n)=>n[1]>m[1]?n:m), nxt=(gs[(i+1)%gs.length][1]).reduce((m,n)=>n[1]>m[1]?n:m);
          let pitch=top[1]; if(sc){ const d0=toDeg(sc,top[1]), d1=toDeg(sc,nxt[1]); pitch=fromDeg(sc,d1===d0?d0+(R()<.5?1:-1):d0+Math.sign(d1-d0)); }
          const tm=t0+Math.round(gap/2/(PPQ/4))*(PPQ/4); if(tm<L) add.push([tm,pitch,top[2]*0.8,Math.min(gap/2,PPQ)]); } }

}
let varState=null; // {clip, opts, result}

/* ---------- edit state ---------- */
function snapshot(){ return {tracks:S.tracks.slice(), rows:snapRows()}; }
function snapRows(){ return S.rows.map(r=>({r,name:r.name,colour:r.colour,clips:Object.fromEntries(Object.entries(r.clips).map(([k,c])=>[k,[c.n,c.colour,c]]))})); }
function restore(snap){ S.tracks=snap.tracks; restoreRows(snap.rows); }
function restoreRows(snap){ S.rows=snap.map(x=>{ x.r.name=x.name; x.r.colour=x.colour; x.r.clips={}; for(const [k,[n,col,c]] of Object.entries(x.clips)){ c.n=n; c.colour=col; x.r.clips[k]=c; } return x.r; }); }
function change(fn,label){ undoStack.push(snapshot()); if(undoStack.length>200) undoStack.shift(); redoStack=[]; fn(); savedNote=''; afterChange(); if(label) toast(label,true); }
function afterChange(){ pruneSel(); render(); inspector(); storeDraft(); }
function pruneSel(){ const lt=new Set(S.tracks); for(const t of [...selTracks]) if(!lt.has(t)) selTracks.delete(t); const live=new Set(S.rows); for(const r of [...selRows]) if(!live.has(r)) selRows.delete(r); if(selClip&&!live.has(selClip.row)) selClip=null; }
function isDirty(){ return S.tracks.some((t,i)=>t._src!==i) || S.rows.length!==S._n0 || S.rows.some((r,i)=>r._src!==i||r._copy||r.name!==r._name||r.colour!==r._colour||r._only||Object.values(r.clips).some(c=>c._gen||c.n!==c._name||c.colour!==c._colour)); }
function orderedSel(){ return S.rows.filter(r=>selRows.has(r)); }
function cloneRow(r,newName){
  const c={...r,clips:{},_copy:true,name:newName};
  for(const [k,v] of Object.entries(r.clips)) c.clips[k]={...v};
  return c;
}

/* ---------- draft kept in this browser ---------- */
const draftKey=()=>RAW?('clip-librarian:'+S.file+':'+RAW.size):null;
function storeDraft(){ const k=draftKey(); if(!k) return;
  try{ if(!isDirty()){ localStorage.removeItem(k); return; }
    localStorage.setItem(k,JSON.stringify({at:Date.now(),tracks:S.tracks.map(t=>t._src),rows:S.rows.map(r=>({src:r._src,copy:!!r._copy,name:r.name,colour:r.colour,only:r._only?Object.keys(r.clips):undefined,clips:Object.fromEntries(Object.entries(r.clips).map(([kk,c])=>[kk,c._gen?[c.n,c.colour,{notes:c.notes,len:c.len,loop:c.loop}]:[c.n,c.colour]]))}))})); }catch(e){} }
function loadDraft(){ const k=draftKey(); if(!k) return null; try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }
function applyDraft(d){
  const base=S._base;
  const tb=S._tbase;
  change(()=>{ if(Array.isArray(d.tracks)&&d.tracks.length===tb.length) S.tracks=d.tracks.map(i=>tb[i]).filter(Boolean); S.rows=d.rows.map(x=>{ const o=base[x.src]; if(!o) return null; const r=x.copy?cloneRow(o,x.name):o; r.name=x.name; r.colour=x.colour;
      if(x.only){ r.clips=Object.fromEntries(x.only.filter(k=>r.clips[k]).map(k=>[k,r.clips[k]])); r._only=true; }
      for(const [k,[n,col,gen]] of Object.entries(x.clips||{})) if(r.clips[k]){ if(gen) r.clips[k]={...r.clips[k],...gen,_gen:true}; r.clips[k].n=n; r.clips[k].colour=col; } return r; }).filter(Boolean); },'Restored your unsaved edits');
}

/* ---------- operations ---------- */
function moveBlock(targetIndex){ // insert the selected rows before S.rows[targetIndex] (or at end)
  const block=orderedSel(); if(!block.length) return;
  const rest=S.rows.filter(r=>!selRows.has(r));
  const before=S.rows.slice(0,targetIndex).filter(r=>!selRows.has(r)).length;
  rest.splice(before,0,...block); S.rows=rest;
}
function nudge(dir){
  const vis=visibleRows(); const block=orderedSel(); if(!block.length) return;
  const vi=block.map(r=>vis.indexOf(r)).filter(i=>i>=0); if(!vi.length) return;
  if(dir<0){ const first=Math.min(...vi); if(first===0) return; const target=vis[first-1]; change(()=>moveBlock(S.rows.indexOf(target))); }
  else{ const last=Math.max(...vi); if(last>=vis.length-1) return; const target=vis[last+1]; change(()=>moveBlock(S.rows.indexOf(target)+1)); }
}
const isMix=t=>[7,8,9].includes(t.type);
function orderedTSel(){ return S.tracks.filter(t=>selTracks.has(t)); }
function moveTracks(targetIndex){ // insert the selected tracks before S.tracks[targetIndex]; mixer tracks stay at the end
  const block=orderedTSel().filter(t=>!isMix(t)); if(!block.length) return;
  const real=S.tracks.filter(t=>!isMix(t)), mix=S.tracks.filter(isMix);
  const before=S.tracks.slice(0,targetIndex).filter(t=>!isMix(t)&&!selTracks.has(t)).length;
  const rest=real.filter(t=>!selTracks.has(t)); rest.splice(before,0,...block); S.tracks=rest.concat(mix);
}
function nudgeTracks(dir){
  const vis=visibleTracks().filter(t=>!isMix(t)); const block=orderedTSel().filter(t=>!isMix(t)); if(!block.length) return;
  const vi=block.map(t=>vis.indexOf(t)).filter(i=>i>=0); if(!vi.length) return;
  const n=block.length, lbl=`Moved ${n} track${n>1?'s':''}`;
  if(dir<0){ const first=Math.min(...vi); if(first===0) return; change(()=>moveTracks(S.tracks.indexOf(vis[first-1])),lbl); }
  else{ const last=Math.max(...vi); if(last>=vis.length-1) return; change(()=>moveTracks(S.tracks.indexOf(vis[last+1])+1),lbl); }
}
function doCopy(){ const b=orderedSel(); if(!b.length) return; clipboard=b; toast(`Copied ${b.length} row${b.length>1?'s':''}`); updateBar(); }
function doPaste(){
  if(!clipboard.length) return;
  const sel=orderedSel(); const at=sel.length?S.rows.indexOf(sel[sel.length-1])+1:S.rows.length;
  const copies=clipboard.map(r=>cloneRow(r,r.name+' copy'));
  change(()=>{ S.rows.splice(at,0,...copies); selRows=new Set(copies); anchor=copies[0]; },`Pasted ${copies.length} row${copies.length>1?'s':''}`);
}
function doDelete(){ const b=orderedSel(); if(!b.length) return; change(()=>{ S.rows=S.rows.filter(r=>!selRows.has(r)); selRows.clear(); },`Deleted ${b.length} row${b.length>1?'s':''}`); }
function doUndo(){ if(!undoStack.length) return; redoStack.push(snapshot()); restore(undoStack.pop()); afterChange(); }
function doRedo(){ if(!redoStack.length) return; undoStack.push(snapshot()); restore(redoStack.pop()); afterChange(); }

/* ---------- saving a copy ---------- */
async function doSave(opts={}){
  if(!RAW){ toast('Open your own .xpj project to save a copy. The built-in example can be edited but not saved.'); return; }
  const standalone=!window.claude;   // opened from a file or your own website: save with a normal browser download
  if(!downloads&&!standalone){ toast('Saving isn’t available in this view. Open the page in claude.ai to save.'); return; }
  const btn=opts.btn||$('save'), label=btn.textContent; btn.disabled=true; btn.textContent='Preparing…';
  try{
    const source=opts.subset||S.rows;
    const rows=source.map(r=>{ const o={src:r._src}; if(r.name!==r._name) o.name=r.name; if(r.colour!==r._colour) o.colour=r.colour;
      if(r._only) o.keep=Object.keys(r.clips);
      const ce={}; for(const [k,c] of Object.entries(r.clips)){ const e={}; if(c.n!==c._name) e.name=c.n; if(c.colour!==c._colour) e.colour=c.colour; if(c._gen) e.gen={notes:c.notes,len:c.len,loop:c.loop}; if(Object.keys(e).length) ce[k]=e; }
      if(Object.keys(ce).length) o.clips=ce; return o; });
    const text=RAW.head+rebuild(RAW.text,RAW.arr,rows,RAW.tarr,RAW.tarr?S.tracks.map(t=>t._src):null);
    const gz=await new Response(new Blob([text]).stream().pipeThrough(new CompressionStream('gzip'))).blob();
    const base=S.file.replace(/\.xpj$/i,'');
    const name=(opts.name||base+' Clip Librarian').replace(/[()\[\]{}]+/g,' ').replace(/[\\/:*?"<>|]+/g,'-').replace(/\s+/g,' ').trim()||base+' extract';
    if(standalone){
      const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([gz],{type:'application/octet-stream'})); a.download=name+'.xpj';
      document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},4000);
      if(!opts.subset) savedNote='Saved '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
      toast(`Saved ${name}.xpj to your Downloads. Copy ${base}_[ProjectData] next to it and rename the copy ${name}_[ProjectData].`);
      return;
    }
    if(typeof JSZip==='undefined') throw {code:'zip'};
    const zip=new JSZip(); zip.file(name+'.xpj',gz,{compression:'STORE'});
    zip.file('README.txt',`Saved by Clip Librarian on ${new Date().toLocaleString()}\n\n${name}.xpj is ${opts.subset?`a new project made from ${source.length} row${source.length>1?'s':''} of ${S.file} (${source.map(r=>r.name).join(', ')}). All tracks, programs and mixer settings are kept`:`an edited copy of ${S.file}`}. The original project is unchanged.\n\nTo open it on the MPC: put ${name}.xpj in the same folder as your original project, make a copy of the folder\n  ${base}_[ProjectData]\nand rename the copy to\n  ${name}_[ProjectData]\nso the MPC finds the samples.\n`);
    const blob=await zip.generateAsync({type:'blob',compression:'STORE'});
    await downloads.save({filename:name+'.zip',data:blob});
    if(!opts.subset) savedNote='Saved '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    toast(`Saved ${name}.zip. Unzip it to get ${name}.xpj.`);
  }catch(e){
    const code=e&&e.code;
    toast(code==='declined'?'Save cancelled.':code==='zip'?'The zip tool didn’t load. Reload the page and try again.':code==='rate_limited'?'A save prompt is already open.':'Saving didn’t work here. '+((e&&e.message)||''));
  }finally{ btn.textContent=label; btn.disabled=false; updateBar(); }
}

/* ---------- rendering ---------- */
const hex=c=>'#'+((c>>>0)&0xffffff).toString(16).padStart(6,'0');

  const nextName=()=>{ let i=2, nm=r.name+' var'; while(S.rows.some(x=>x.name===nm)) nm=r.name+' var '+(i++); return nm; };
  const insert=row=>{ const at=S.rows.indexOf(r)+1; S.rows.splice(at,0,row); selClip={row,t:t.name}; varState=null; };
  $('v_row').onclick=()=>change(()=>{ const row=cloneRow(r,nextName()); row.clips[t.name]=vclip(); insert(row); },'Added variation as a new row');
  $('v_only').onclick=()=>change(()=>{ const row=cloneRow(r,nextName()); row.clips={[t.name]:vclip()}; row._only=true; insert(row); },'Added a row with just the variation');
  $('v_replace').onclick=()=>change(()=>{ r.clips[t.name]=vclip(); selClip={row:r,t:t.name}; varState=null; },'Replaced the clip with the variation');
}
function trackSummary(){
  return `<div class="sec">Tracks</div><dl class="kv">${visibleTracks().map((t,k)=>`<dt>${k+1}</dt><dd>${esc(t.name)} <span style="color:var(--muted)">${(TYPES[t.type]||['?'])[0]}${t.out?' · '+esc(outLabel(t.out)):''}</span></dd>`).join('')}</dl>`;
}
const posStr=t=>{const bar=Math.floor(t/(PPQ*4))+1, beat=Math.floor((t%(PPQ*4))/PPQ)+1, tick=t%PPQ;return `${bar}.${beat}.${String(tick).padStart(3,'0')}`;};
function drawRoll(c,tok,id='roll'){
  const cv=$(id), dpr=window.devicePixelRatio||1, w=cv.clientWidth, h=cv.clientHeight; if(!w) return; cv.width=w*dpr; cv.height=h*dpr;
  const g=cv.getContext('2d'); g.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement), col=cs.getPropertyValue(tok).trim(), line=cs.getPropertyValue('--line').trim();
  const ns=c.notes, lo=Math.min(...ns.map(n=>n[1]))-1, hi=Math.max(...ns.map(n=>n[1]))+1, L=Math.max(c.len,1);
  const nb=Math.max(1,Math.round(L/(PPQ*4)));
  g.strokeStyle=line; g.lineWidth=1;
  for(let b=0;b<=nb*4;b++){const x=Math.round(b/(nb*4)*w)+.5; g.globalAlpha=b%4?0.35:1; g.beginPath(); g.moveTo(x,0); g.lineTo(x,h); g.stroke();}
  const rh=Math.max(2,Math.min(10,h/(hi-lo+1)));
  for(const n of ns){const x=n[0]/L*w, y=h-(n[1]-lo+0.5)*(h/(hi-lo+1))-rh/2, ww=Math.max(2,n[3]/L*w);
    g.fillStyle=col; g.globalAlpha=0.35+0.65*n[2]/127; g.fillRect(x,y,ww,rh);}
  g.globalAlpha=1;
}
let toastTimer=null;
function toast(msg,undoable){ const t=$('toast'); t.innerHTML=`<span>${esc(msg)}</span>${undoable?'<button id="toastUndo">Undo</button>':''}`; t.hidden=false;
  const u=$('toastUndo'); if(u) u.onclick=()=>{doUndo(); t.hidden=true;};
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.hidden=true,4000); }

/* ---------- selection, rename, drag ---------- */
const rowAt=i=>S.rows[+i];
$('grid').addEventListener('click',e=>{
  const cell=e.target.closest('.cell');
  if(cell){ selClip={row:rowAt(cell.dataset.i),t:cell.dataset.t}; selTracks.clear(); paintSelection(); inspector(); return; }
  const ch=e.target.closest('th.colhead[data-ti]');
  if(ch){ const t=S.tracks[+ch.dataset.ti]; if(isMix(t)) return; selClip=null; selRows.clear();
    if(e.shiftKey&&tanchor&&S.tracks.includes(tanchor)){ const vis=visibleTracks().filter(x=>!isMix(x)); const a=vis.indexOf(tanchor), b=vis.indexOf(t); selTracks=new Set(vis.slice(Math.min(a,b),Math.max(a,b)+1)); }
    else if(e.metaKey||e.ctrlKey){ selTracks.has(t)?selTracks.delete(t):selTracks.add(t); tanchor=t; }
    else { selTracks=new Set([t]); tanchor=t; }
    paintSelection(); inspector(); return; }
  const th=e.target.closest('th.rowhead[data-i]'); if(!th||e.target.closest('input')) return;
  const r=rowAt(th.dataset.i); selClip=null; selTracks.clear();
  if(e.shiftKey&&anchor&&S.rows.includes(anchor)){ const vis=visibleRows(); const a=vis.indexOf(anchor), b=vis.indexOf(r); selRows=new Set(vis.slice(Math.min(a,b),Math.max(a,b)+1)); }
  else if(e.metaKey||e.ctrlKey){ selRows.has(r)?selRows.delete(r):selRows.add(r); anchor=r; }
  else { selRows=new Set([r]); anchor=r; }
  paintSelection(); inspector();
});
function paintSelection(){ // update highlights without redrawing, so double-click keeps working
  const ref=selRows.size===1?rowKey([...selRows][0]):null;
  document.querySelectorAll('#grid tbody tr[data-i]').forEach(tr=>{ const ch=tr.querySelector('.rowhead .key'); if(!ch) return; const r=rowAt(tr.dataset.i);
    const rel=ref&&!selRows.has(r)?keyRelation(ref,rowKey(r)):''; ch.classList.toggle('same',rel==='same'); ch.classList.toggle('near',rel==='near'); });
  document.querySelectorAll('#grid tbody tr[data-i]').forEach(tr=>tr.classList.toggle('selrow',selRows.has(rowAt(tr.dataset.i))));
  document.querySelectorAll('#grid th.colhead[data-ti]').forEach(th=>th.classList.toggle('selcol',selTracks.has(S.tracks[+th.dataset.ti])));
  const selNames=new Set([...selTracks].map(t=>t.name));
  document.querySelectorAll('#grid tbody td.c').forEach(td=>{ const b=td.querySelector('.cell'); if(b) td.classList.toggle('selcol',selNames.has(b.dataset.t)); });
  if(selTracks.size){ const idx=[...document.querySelectorAll('#grid thead th')].map(th=>th.dataset.ti!=null&&selTracks.has(S.tracks[+th.dataset.ti]));
    document.querySelectorAll('#grid tbody tr').forEach(tr=>[...tr.children].forEach((td,i)=>{ if(i&&td.tagName==='TD') td.classList.toggle('selcol',!!idx[i]); })); }
  else document.querySelectorAll('#grid tbody td.selcol').forEach(td=>td.classList.remove('selcol'));
  document.querySelectorAll('#grid .cell').forEach(c=>c.classList.toggle('sel',!!selClip&&selClip.row===rowAt(c.dataset.i)&&selClip.t===c.dataset.t));
  updateBar();
}
$('grid').addEventListener('dblclick',e=>{
  const th0=e.target.closest('th.rowhead[data-i]'); if(!th0) return;
  const idx=th0.dataset.i, th=$('grid').querySelector('th.rowhead[data-i="'+idx+'"]'); if(!th) return;
  const r=rowAt(idx), span=th.querySelector('.rn'); if(!span) return;
  const inp=document.createElement('input'); inp.className='rename'; inp.value=r.name; inp.setAttribute('aria-label','Row name');
  span.replaceWith(inp); inp.focus(); inp.select(); th.draggable=false;
  let done=false; const finish=ok=>{ if(done) return; done=true; const v=inp.value.trim(); if(ok&&v&&v!==r.name) change(()=>{r.name=v;},'Renamed row'); else render(); };
  inp.addEventListener('keydown',ev=>{ ev.stopPropagation(); if(ev.key==='Enter') finish(true); if(ev.key==='Escape') finish(false); });
  inp.addEventListener('blur',()=>finish(true));
});
$('insp').addEventListener('click',e=>{
  const rc=e.target.closest('[data-rowcol]'), cc=e.target.closest('[data-clipcol]');
  if(rc){ const v=+rc.dataset.rowcol; const rs=orderedSel(); change(()=>rs.forEach(r=>r.colour=v),'Changed row colour'); }
  if(cc&&selClip){ const v=+cc.dataset.clipcol; const c=selClip.row.clips[selClip.t]; change(()=>{c.colour=v;},'Changed clip colour'); }
});
let dragOver=null;
$('grid').addEventListener('dragstart',e=>{
  const ch=e.target.closest('th.colhead[data-ti]');
  if(ch){ const t=S.tracks[+ch.dataset.ti]; if(isMix(t)){ e.preventDefault(); return; }
    if(!selTracks.has(t)){ selTracks=new Set([t]); tanchor=t; selRows.clear(); selClip=null; paintSelection(); inspector(); }
    dragKind='tracks'; e.dataTransfer.effectAllowed='move'; try{ e.dataTransfer.setData('text/plain','tracks'); }catch(_){}
    requestAnimationFrame(()=>document.querySelectorAll('#grid th.colhead.selcol').forEach(x=>x.classList.add('dragging'))); return; }
  const th=e.target.closest('th.rowhead[data-i]'); if(!th){ e.preventDefault(); return; }
  dragKind='rows';
  const r=rowAt(th.dataset.i); if(!selRows.has(r)){ selRows=new Set([r]); anchor=r; selClip=null; }
  e.dataTransfer.effectAllowed='move'; try{ e.dataTransfer.setData('text/plain','rows'); }catch(_){}
  requestAnimationFrame(()=>document.querySelectorAll('#grid tbody tr').forEach(tr=>{ if(selRows.has(rowAt(tr.dataset.i))) tr.classList.add('dragging'); }));
});
$('grid').addEventListener('dragover',e=>{
  if(dragKind==='tracks'){ const th=e.target.closest('th.colhead[data-ti]'); if(!th||isMix(S.tracks[+th.dataset.ti])) return; e.preventDefault();
    const rect=th.getBoundingClientRect(); const after=e.clientX>rect.left+rect.width/2;
    if(dragOver&&dragOver.el!==th) dragOver.el.classList.remove('drop-left','drop-right');
    th.classList.toggle('drop-right',after); th.classList.toggle('drop-left',!after); dragOver={el:th,after,kind:'tracks'}; return; }
  const tr=e.target.closest('tbody tr'); if(!tr||!selRows.size||dragKind!=='rows') return; e.preventDefault();
  const rect=tr.getBoundingClientRect(); const after=e.clientY>rect.top+rect.height/2;
  if(dragOver&&dragOver.el!==tr) dragOver.el.classList.remove('drop-before','drop-after');
  tr.classList.toggle('drop-after',after); tr.classList.toggle('drop-before',!after); dragOver={el:tr,after,kind:'rows'};
});
$('grid').addEventListener('drop',e=>{
  e.preventDefault(); if(!dragOver) return;
  if(dragOver.kind==='tracks'){ const target=+dragOver.el.dataset.ti+(dragOver.after?1:0); dragOver=null; const n=selTracks.size; change(()=>moveTracks(target),`Moved ${n} track${n>1?'s':''}`); return; }
  const target=+dragOver.el.dataset.i+(dragOver.after?1:0); dragOver=null;
  const n=selRows.size; change(()=>moveBlock(target),`Moved ${n} row${n>1?'s':''}`);
});
$('grid').addEventListener('dragend',()=>{ if(dragOver){dragOver.el.classList.remove('drop-before','drop-after','drop-left','drop-right'); dragOver=null;} dragKind=null; document.querySelectorAll('.dragging').forEach(t=>t.classList.remove('dragging')); });

/* ---------- toolbar, keys, files ---------- */
$('up').onclick=()=>nudge(-1); $('down').onclick=()=>nudge(1); $('tleft').onclick=()=>nudgeTracks(-1); $('tright').onclick=()=>nudgeTracks(1);
$('copy').onclick=doCopy; $('paste').onclick=doPaste; $('del').onclick=doDelete; $('undo').onclick=doUndo; $('redo').onclick=doRedo; $('save').onclick=doSave;
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea')) return;
  const mod=e.metaKey||e.ctrlKey, k=e.key.toLowerCase();
  if(mod&&k==='c'){ if(selRows.size){e.preventDefault();doCopy();} }
  else if(mod&&k==='v'){ if(clipboard.length){e.preventDefault();doPaste();} }
  else if(mod&&k==='z'){ e.preventDefault(); e.shiftKey?doRedo():doUndo(); }
  else if(mod&&k==='y'){ e.preventDefault(); doRedo(); }
  else if(mod&&k==='a'){ e.preventDefault(); selRows=new Set(visibleRows()); selClip=null; render(); inspector(); }
  else if((k==='delete'||k==='backspace')&&selRows.size){ e.preventDefault(); doDelete(); }
  else if(e.altKey&&(k==='arrowup'||k==='arrowdown')&&selRows.size){ e.preventDefault(); nudge(k==='arrowup'?-1:1); }
  else if(e.altKey&&(k==='arrowleft'||k==='arrowright')&&selTracks.size){ e.preventDefault(); nudgeTracks(k==='arrowleft'?-1:1); }
  else if(k==='escape'){ selRows.clear(); selTracks.clear(); selClip=null; render(); inspector(); }
});
['q','hideEmptyRows','hideMix'].forEach(id=>$(id).addEventListener('input',()=>{render(); inspector();}));
$('open').addEventListener('click',()=>$('file').click());
$('file').addEventListener('change',e=>{const f=e.target.files[0]; if(f) load(f); e.target.value='';});
let dragDepth=0;
const isFiles=e=>e.dataTransfer&&[...e.dataTransfer.types].includes('Files');
window.addEventListener('dragenter',e=>{if(isFiles(e)){dragDepth++; $('drop').hidden=false;}});
window.addEventListener('dragleave',e=>{if(isFiles(e)&&--dragDepth<=0){dragDepth=0;$('drop').hidden=true;}});
window.addEventListener('dragover',e=>{if(isFiles(e)) e.preventDefault();});
window.addEventListener('drop',e=>{if(!isFiles(e)) return; e.preventDefault(); dragDepth=0; $('drop').hidden=true; const f=e.dataTransfer.files[0]; if(f) load(f);});
function setProject(s,raw){
  keyFilter=null; mixRow=null; S=prepare(s); S._base=S.rows.slice(); S._tbase=S.tracks.slice(); S._n0=S.rows.length; RAW=raw;
  selTracks=new Set(); tanchor=null; selRows=new Set(); anchor=null; selClip=null; clipboard=[]; undoStack=[]; redoStack=[]; savedNote='';
}
async function load(f){
  $('busy').hidden=false; $('busy').textContent='Reading '+f.name+'…';
  try{
    const {s,raw}=await readXpj(f); setProject(s,raw); render(); inspector(); $('gridwrap').scrollTo(0,0);
    const d=loadDraft();
    if(d){ const t=$('toast'); t.innerHTML=`<span>You have unsaved edits to this project from ${new Date(d.at).toLocaleString()}.</span><button id="restoreDraft">Restore them</button>`; t.hidden=false; clearTimeout(toastTimer);
      $('restoreDraft').onclick=()=>{ t.hidden=true; applyDraft(d); }; toastTimer=setTimeout(()=>t.hidden=true,15000); }
  }catch(err){ $('banner').innerHTML=`<span class="err">${esc(err.message||String(err))}</span>`; }
  finally{ $('busy').hidden=true; }
}
window.addEventListener('resize',()=>{ if(selClip) inspector(); });

let sample; try{ sample=JSON.parse($('sample').textContent); sample.sample=true; }catch(e){ sample={file:'(none)',tracks:[],rows:[]}; }
setProject(sample,null); render(); inspector();
